spring:
  config:
    activate:
      on-profile: dev

# 本地开发默认允许常用的前端访问地址，APP_CORS_ALLOWED_ORIGINS 仍可覆盖该默认值。
app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001,http://127.0.0.1:4300,http://localhost:4300,http://127.0.0.1:4173,http://localhost:4173}"
